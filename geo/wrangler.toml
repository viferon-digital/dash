name = "viferon-geo-dashboard"
compatibility_date = "2025-07-18"
pages_build_output_dir = "public"

# ID таблицы держим на сервере: в браузер он не попадает — дашборд ходит
# только в /api/geo. В проде эти же значения удобнее задать в
# Cloudflare Pages → Settings → Variables and Secrets.
[vars]
SHEET_ID = "1SNZk25KdIKaeughg1SBqKBmmhQKuwJ9Nl115ZNAkxR8"
SHEET_NAME = "Data"
CACHE_TTL = "900"

# Вход. Дашборд закрыт: без куки сессии, выданной на viferon.digital, охранник
# уводит на страницу входа. Секрет SESSION_SECRET задаётся в Cloudflare Pages →
# Settings → Variables and Secrets и сюда, разумеется, не попадает.
PROJECT_SLUG = "geo"
AUTH_ORIGIN = "https://viferon.digital"
