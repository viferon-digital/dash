name = "viferon-dash"
compatibility_date = "2025-07-18"
pages_build_output_dir = "public"

# Публичные значения: реестр проектов лежит в таблице, открытой «по ссылке —
# читатель», поэтому его id не секрет. Секреты (SESSION_SECRET, ключ сервисного
# аккаунта) задаются в Cloudflare Pages → Settings → Variables and Secrets и
# сюда не попадают. Локально их удобно держать в .dev.vars (он в .gitignore).
[vars]
SHEET_ID = "1tqVSdoyyLv319I_SHiC_Mt8uhebxikKC1Aj1XYIZViA"
PROJECTS_SHEET = "Проекты"
CACHE_TTL = "300"

# Вход. sheet — по списку доступа из Google Таблицы, off — сайт открыт всем
# (только для локальной разработки).
AUTH_MODE = "sheet"
ACCESS_SHEET_ID = "1iFx0CX3xHjTruOj--rRTHECXFtF6Y5g1IQd4dus5L2w"
ACCESS_SHEET = "Доступ"
GOOGLE_CLIENT_ID = "704309505992-qi083d1065l1vir2p853ir82ajooguu7.apps.googleusercontent.com"
ACCESS_TTL = "60"
SESSION_TTL_HOURS = "12"
